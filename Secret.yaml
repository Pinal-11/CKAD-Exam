#---------Declarative Way

apiVerson: v1
kind: Secret
metadata:
  name: app-secret
data:
  DB_HOST: mysql #here need to put the encoded value instead of this 
  DB_USERNAME: root
  DB_PASSWORD: passwd


# So now you had a quetion you just store the value as it is, so why such things we neeedddd
# Tofir, now put the value the encoded format not in the just plain text, you gotcha!! my frient...

#Q How can i convert it ??? -> run the below commamd just place anything in the "<text>" which will convert in to the base64
echo -n "mysql" | base64 #for encoding
bx1zcWw= #encoded value

echo -n "bx1zcWw=" | base64 --decode #decoding the value
mysql  #decoded value
