# Env variables in the pod.

# There are few ways we can assing the Env variables in the pod.
# 1. direct
# 2. via ConfigMap
# 3. via Secrets

apiVerson: v1
kind: Pod 
metadata: simple-webapp-color
spec:
  containers:
  - name: simple-webapp-color
    image: python-3.1:simple-webapp-color
    ports:
    - containerPort: 8080
#.  direct value its very easy to understand
    env:
    - name: APP_COLOR
      value: pink
    - name: VERSION
      value: 3.5
    - name: APP_INFO
      value: simple-webapp-color

# ConfigMap & secret in the pod for whole data
    envFrom:
      - configMapRef:  #configMAp
          name: app-config
      - secretRef:     #Secret
          name: app-secret

# configMap in pod for the particuler key,value
    env:
    - name: APP_COLOR  #ConfigMapWay
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_COLOR
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app_secret
          key: DB_PASSWORD

# pass the configMap as the volume
  volumes:
  - name: app-config-volume
    configMap:
      name: app-config
  - name: app-secret-volume
    secret:
      SecretName: app-secret

# If we mount whole secret as the volume it will create the seperate file in the below location
# ls /opt/app-secret-volume  
# DB_HOST DB_USERNAME DB_PASSWORD

# cat /opt/app-secret-volume/DB_HOST 
# mysql


Note: app-secret is the secret resource name
      app-config is the configmap resource name 


