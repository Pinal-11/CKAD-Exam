#KuberNetes Security Context

#----1st way--------
apiVerson: v1
kind: Pod
metadata:
  name: web-pod
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: web-pod
    image: ubuntu
    command: ["sleep", "3600"]

#----2nd way--------
apiVerson: v1
kind: Pod
metadata:
  name: web-pod
spec:
  containers:
  - name: web-pod
    image: ubuntu
    command: ["sleep", "3600"]
    securityContext:
      runAsUser: 1000
      capabilities:
        add: ["MAC_ADMIN"]


# Here you can add the security context at the pod and container level
# But the capabilities only applicable at the Container Level.




apiVersion: v1
kind: Pod
metadata:
  name: multi-pod
spec:
  securityContext:
    runAsUser: 1001
  containers:
  -  image: ubuntu
     name: web
     command: ["sleep", "5000"]
     securityContext:
      runAsUser: 1002

  -  image: ubuntu
     name: sidecar
     command: ["sleep", "5000"]

# in the above code with what user are the processes in the web container started? --> 1002
# The User ID defined in the securityContext of the container overrides the User ID in the POD.

# Within the same multi-pod definition file, which user is utilized to start the processes in the sidecar container? --> 1001
# The User ID defined in the securityContext of the POD is carried over to all the containers in the Pod.


# Update the pod ubuntu-sleeper to run as Root user and with the SYS_TIME capability.
apiVerson: v1
kind: Pod
metadata:
  name: web-pod
spec:
  containers:
  - name: web-pod
    image: ubuntu
    command: ["sleep", "3600"]
    securityContext:
      capabilities:
        add: ["SYS_TIME"]

# Now update the pod to also make use of the NET_ADMIN capability.
apiVerson: v1
kind: Pod
metadata:
  name: web-pod
spec:
  containers:
  - name: web-pod
    image: ubuntu
    command: ["sleep", "3600"]
    securityContext:
      capabilities:
        add: ["SYS_TIME" , "NET_ADMIN"]

# Note: Ensure that you set the capabilities at the container level rather than at the pod level, as configuring them at the pod level is not supported.
